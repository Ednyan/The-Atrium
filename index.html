<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/glass_dome_small_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- What a search engine and a link preview get.

         The app routes on the hash (#/browse, #/contributors), and search
         engines have ignored fragments for indexing since 2015 -- so there is
         exactly one indexable page however many screens the app has, and
         everything below has to do the work for all of them.

         og:image is og-card.png, built by scripts/make-og-image.mjs. It used
         to be glass_dome.png, which is 2780x2503 and so arrived cropped to its
         middle in every client that shows a large card. Replacing that file
         with a 1200x630 screenshot of a full atrium would be better still and
         needs no change here; see docs/BEING_FOUND.md.

         The description is kept near 155 characters, because that is roughly
         where Google truncates it and a sentence cut mid-clause reads as
         carelessness in the one place everybody looks. -->
    <!-- Also the browser tab, which is the same string and cannot be a
         different one. A tab truncates from the end, so the name has to come
         first and survive it: "Digital Atrium —…" reads, "The Digital Atri…"
         does not. The definite article costs nothing in a search result and a
         whole word of a narrow tab. -->
    <title>Digital Atrium — Your ideas in one place</title>
    <meta name="description" content="An interactive space where ideas take shape, are seen, shared and built on. A fast, flexible tool for brainstorming, references, diagrams and much more." />
    <link rel="canonical" href="https://digitalatrium.org/" />
    <meta name="theme-color" content="#191919" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Digital Atrium" />
    <meta property="og:title" content="The Digital Atrium" />
    <meta property="og:description" content="An interactive space where ideas take shape, are seen, shared and built on." />
    <meta property="og:image" content="https://digitalatrium.org/og-card.png" />
    <!-- Stated so a client can reserve the space before the image arrives,
         rather than showing a bare link and then reflowing under it. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Digital Atrium mark: a wireframe portal beneath a point of light." />
    <meta property="og:url" content="https://digitalatrium.org/" />
    <!-- One URL, and the interface picks its language at runtime, so there is
         nothing for hreflang to point at. This says what the markup below is
         written in and claims nothing more. -->
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Digital Atrium" />
    <meta name="twitter:description" content="An interactive space where ideas take shape, are seen, shared and built on." />
    <meta name="twitter:image" content="https://digitalatrium.org/og-card.png" />
    <meta name="twitter:image:alt" content="The Digital Atrium mark: a wireframe portal beneath a point of light." />

    <!-- What the thing is, in the form a search engine reads without inferring
         it from prose. Free is stated because it is true and because it is the
         first question anybody asks; contributing is a donation, not a price. -->
    <!-- The site's own name, which is a separate question from what the app
         is. Google prints a site name above the title in a result, and with
         nothing to go on it falls back to the bare domain -- so the listing
         read "digitalatrium.org" instead of the name. WebSite with a name is
         what it looks for. url and name have to agree with the canonical for
         it to be trusted, and alternateName covers the shorter form people
         actually search for. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Digital Atrium",
      "alternateName": "The Digital Atrium",
      "url": "https://digitalatrium.org/"
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "The Digital Atrium",
      "url": "https://digitalatrium.org/",
      "description": "An interactive space where ideas take shape, are seen, shared and built on. A fast, flexible tool for brainstorming, references, diagrams and much more.",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web browser, Windows",
      "image": "https://digitalatrium.org/og-card.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- The shell renders empty until React runs, so this is both what a
         visitor without JavaScript should see and the only prose the first
         crawl pass has to go on. -->
    <noscript>
      <h1>The Digital Atrium</h1>
      <p>
        An interactive space where ideas take shape, are seen, shared and built
        on. A fast, flexible tool for brainstorming, references, diagrams and
        much more.
      </p>
      <p>The Digital Atrium needs JavaScript enabled to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
