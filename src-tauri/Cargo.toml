[package]
name = "the-digital-atrium"
version = "1.15.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools in release builds too. Without it F12 does nothing in a shipped
# app -- Tauri only enables it automatically for debug builds -- which meant
# the one place a bug actually reproduced was the one place it could not be
# looked at. Costs some binary size and lets anyone open the inspector, which
# is a fair trade for being able to diagnose what users are actually running.
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
# The overlay (set_overlay): a shortcut that turns click-through off from anywhere.
# 2.3: 2.4 wants Tauri 2.12, and would take the whole tree up with it.
tauri-plugin-global-shortcut = "~2.3.2"
# Already in the tree via the updater; declared here so the image download
# command can use it. rustls to match what is already being built rather than
# pulling a second TLS stack in.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Live files (listen_for_dropped_paths): WebView2's own interfaces, for the
# path of a dropped file. The versions Tauri itself is built on, already in
# the tree.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# The overlay (set_overlay): the window seen through, and the taskbar
# preview's button. The version Tauri 2.10 itself is built on.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Tuned so the release build fits in this machine's available commit rather
# than for maximum optimization. Compiling the final binary at the stock
# release profile repeatedly aborted with "memory allocation of 19592 bytes
# failed" (STATUS_STACK_BUFFER_OVERRUN): rustc ballooned past the ~5GB of
# free commit and then died on the next small allocation.
#
# codegen-units is the lever that actually matters here -- more units means
# each is optimized separately, so peak working set drops sharply. opt-level
# 2 vs 3 costs very little for an app that spends nearly all its time in the
# webview rather than in Rust, and trims the peak further.
[profile.release]
codegen-units = 32
opt-level = 2
