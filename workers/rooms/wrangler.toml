# The rooms atriums' people meet in (src/index.ts). Deploy: see README.md.
name = "atrium-rooms"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# A room per atrium. SQLite-backed, the kind the free plan offers; nothing
# is stored in it.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# On the site's own domain, so the address doesn't depend on the account's
# workers.dev name. Comment these two lines out to use workers.dev instead.
[[routes]]
pattern = "rooms.digitalatrium.org"
custom_domain = true

# The directory of who's who (src/people.ts): usernames, Drive keys and
# folders, invitations. Its tables are made by the worker on first use.
[[d1_databases]]
binding = "PEOPLE"
database_name = "atrium-people"
database_id = "98e3f3c7-95f3-4482-b0b2-f8be13c26562"

# SUPABASE_URL and SUPABASE_ANON_KEY are secrets (wrangler secret put), or
# .dev.vars locally. So is GOOGLE_CLIENT_SECRET: Drive atriums staying signed
# in to Google (src/index.ts, google). The client id is public.
[vars]
GOOGLE_CLIENT_ID = "770548685806-6akubmjpt973rrtf1pjsncdrvj76dlh7.apps.googleusercontent.com"
