<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code History · The Digital Atrium</title>
<!-- Template for scripts/graph-growth.py, which fills in the data. -->
<style>
  :root { --bg: #07070b; --fg: #dcdce4; --dim: #8b8b98; --line: #262631; --accent: #ff8a3d; --pregit: #8b7cf0;
          --panel: #13131a; --strong: #fff; --metal: linear-gradient(100deg, #FFFFFF 0%, #A9A9A9 100%); --lead: rgb(220 220 228 / .86); }
  /* Light, as the landing page's is: paper, ink, the metal darkened. */
  :root[data-theme='light'] { --bg: #f2efe8; --fg: #2e2a25; --dim: #6e685f; --line: #d6d0c4; --pregit: #6b5bd6;
          --panel: #fbfaf6; --strong: #161412; --metal: linear-gradient(100deg, #1A1714 0%, #55504A 100%); --lead: rgb(46 42 37 / .82); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, Consolas, monospace; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #c.dragging { cursor: grabbing; }
  #hud { position: fixed; left: 18px; top: 76px; pointer-events: none; max-width: min(640px, calc(100vw - 80px)); }
  /* The bar along the top, as the landing page has one: the way back on the
     left, what this is in the middle, the language and light or dark on the
     right -- the site's own buttons, bordered, a corner cut. */
  #top { position: fixed; top: 0; left: 0; right: 0; z-index: 3; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 18px;
         background: color-mix(in srgb, var(--bg) 84%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  #top .end { margin-left: auto; display: flex; gap: 8px; }
  #title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; pointer-events: none;
           font-size: 11px; letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; color: var(--strong); }
  #title i { width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); }
  #title span + span { color: var(--dim); }
  .chrome { height: 34px; display: inline-flex; align-items: center; gap: 10px;
            background: var(--panel); color: var(--fg); border: 1px solid var(--line); font: inherit; text-decoration: none; cursor: pointer;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
            transition: border-color .25s ease, color .25s ease, background .25s ease; }
  .chrome:hover { border-color: var(--accent); color: var(--strong); }
  #back { padding: 0 16px 0 12px; letter-spacing: .22em; text-transform: uppercase; font-size: 11px; }
  #back b { font-weight: normal; transition: transform .25s ease; }
  #back:hover b { transform: translateX(-3px); }
  #mode { width: 34px; justify-content: center; padding: 0; }
  .chrome svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  /* The language: the select itself, the whole button wide, so its own list opens. */
  #langWrap { position: relative; padding: 0 12px 0 10px; gap: 8px; }
  #lang { position: absolute; inset: 0; opacity: 0; cursor: pointer; font: inherit; }
  #lang option { background: var(--panel); color: var(--fg); }
  #langName { font-size: 12px; }
  @media (max-width: 1000px) { #title span + span { display: none; } }
  @media (max-width: 760px) { #title, #back span, #langName { display: none; } }

  /* The landing page and this one slide past each other, as neighbours: it
     goes off to the left as this comes in from the right. From the landing
     page itself, that slide is the landing page's (this page is framed over
     it); these are for arriving here as a document, where a browser can. */
  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: 650ms cubic-bezier(.65, 0, .35, 1) both slide-off-left; }
  ::view-transition-new(root) { animation: 650ms cubic-bezier(.65, 0, .35, 1) both slide-in-right; }
  @keyframes slide-off-left { to { transform: translateX(-100%); } }
  @keyframes slide-in-right { from { transform: translateX(100%); } }
  #date { font-size: 30px; letter-spacing: .06em; }
  #stats { color: var(--dim); margin-top: 2px; }
  #note { color: var(--fg); opacity: .8; margin-top: 6px; font-style: italic; }
  /* What's what, and how to move about: two panels down the right, the
     legend's marks drawn as the graph draws them, in its colours. */
  #side { position: fixed; right: 18px; top: 74px; z-index: 2; width: 264px; display: flex; flex-direction: column; gap: 12px; }
  .panel { padding: 12px 14px 13px; background: color-mix(in srgb, var(--panel) 86%, transparent); border: 1px solid var(--line);
           clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%); }
  .panel h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font: inherit; font-size: 10.5px; letter-spacing: .28em;
              text-transform: uppercase; color: var(--dim); }
  .panel h2::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #legend li { display: flex; align-items: center; gap: 10px; }
  #legend svg { width: 26px; height: 14px; flex: none; overflow: visible; }
  #controls ul { grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; }
  #controls li { display: contents; }
  kbd { justify-self: start; padding: 1px 7px; font: inherit; font-size: 11px; color: var(--fg); background: var(--bg);
        border: 1px solid var(--line); border-bottom-width: 2px; white-space: nowrap; }
  #controls span { color: var(--dim); }
  @media (max-width: 760px), (max-height: 560px) { #side { display: none; } }
  @media (min-width: 761px) { #hud { max-width: min(640px, calc(100vw - 340px)); } }
  #bar { position: fixed; left: 18px; right: 18px; bottom: 14px; display: flex; gap: 10px; align-items: center; }
  #bar button, #bar select { background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 6px 12px; font: inherit; cursor: pointer; }
  #bar button:hover, #bar select:hover { border-color: var(--accent); }
  #track { flex: 1; position: relative; }
  #era { position: absolute; left: 0; top: -14px; height: 3px; background: var(--pregit); }
  #eraLabel { position: absolute; left: 0; top: -30px; color: var(--pregit); font-size: 11px; white-space: nowrap; }
  #slider { width: 100%; accent-color: var(--accent); }
  #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; display: none; max-width: 60vw; }
  #tip small { color: var(--dim); display: block; }
  #hud, #side, #bar { transition: opacity 1.2s ease; }
  body.intro #hud, body.intro #side, body.intro #bar { opacity: 0; pointer-events: none; }
  :root[data-theme='light'] body.intro canvas { filter: brightness(1.05) saturate(0.35) blur(1.5px); }
  /* Behind the title the graph is texture, not content: darker, greyer and a
     little soft, so the name stands clear of it. The canvas is empty by the
     time the filter comes off, so the switch never shows. */
  body.intro canvas { filter: brightness(0.6) saturate(0.35) blur(1.5px); }
  #intro { position: fixed; inset: 0; pointer-events: none; }
  /* Two moments, one over the other: the name; then, once it has gone, what
     follows. */
  #intro > div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 22px; padding: 0 24px; text-align: center; opacity: 0; }
  /* The line before the name, and what follows it: large and light enough to
     read over the graph, which is what they're there for. */
  #intro small { color: var(--lead); font-size: clamp(14px, 1.45vw, 19px); letter-spacing: .2em; text-transform: uppercase; }
  #intro #explain { max-width: 32em; margin: 0; color: var(--lead); font-size: clamp(16px, 1.7vw, 23px);
                    line-height: 1.65; letter-spacing: .02em; }
  /* The one way past the opening: clicks and keys no longer skip it. */
  #skip { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 2; background: var(--panel); color: var(--fg);
          border: 1px solid var(--line); padding: 8px 18px; font: inherit; letter-spacing: .12em; cursor: pointer; }
  #skip:hover { border-color: var(--accent); }
  /* The name as the landing page sets it: the same face, weights, sizes and
     the metal on ATRIUM, in its dark theme. */
  #intro h1 { margin: 0; font: 300 1em/0.86 Consolas, Monaco, 'Lucida Console', 'Liberation Mono', monospace; letter-spacing: -0.02em; }
  #intro h1 { white-space: nowrap; font-size: clamp(2rem, 6.4vw, 5.6rem); }
  #intro .the { font-weight: 200; letter-spacing: .12em; color: var(--lead); opacity: .85; }
  #intro .digital { color: var(--strong); text-shadow: 0 0 60px rgb(255 255 255 / .14); }
  #intro .atrium { background-image: var(--metal); -webkit-background-clip: text;
                   background-clip: text; color: transparent; filter: drop-shadow(0 0 34px rgb(255 255 255 / .22)); }
</style>
</head>
<body class="intro">
<canvas id="c"></canvas>
<header id="top">
  <a id="back" class="chrome" href="/"><b>←</b><span data-t="back">Back to homepage</span></a>
  <div id="title"><i></i><span data-t="title">Code history</span><span>The Digital Atrium</span></div>
  <div class="end">
    <label id="langWrap" class="chrome"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></svg><span id="langName"></span><select id="lang"></select></label>
    <button id="mode" class="chrome" type="button"></button>
  </div>
</header>
<div id="intro"><div id="introName"><small data-t="lead">You're about to see the code history of</small><h1><span class="the">THE</span> <span class="digital">DIGITAL</span> <span class="atrium">ATRIUM</span></h1></div><div id="introNext"><p id="explain" data-t="explain"></p></div></div>
<button id="skip" data-t="skip">Skip intro</button>
<div id="hud"><div id="date"></div><div id="stats"></div><div id="note"></div></div>
<div id="side">
  <section id="legend" class="panel"><h2 data-t="legendTitle">Legend</h2><ul></ul></section>
  <section id="controls" class="panel"><h2 data-t="controlsTitle">Controls</h2><ul></ul></section>
</div>
<div id="tip"></div>
<div id="bar">
  <button id="play">Pause</button>
  <div id="track"><div id="era"></div><div id="eraLabel" data-t="era">before git</div><input id="slider" type="range" min="0" step="0.01" value="0" aria-label="Timeline"></div>
  <select id="speed" aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option><option value="8">8x</option></select>
</div>
<script src="growth.js?v=afcd5c2dc582"></script>
</body>
</html>
