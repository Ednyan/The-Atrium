name: Release desktop app

# Fires on a version tag. Tagging is the deliberate act that publishes a
# release -- pushing to the branch does not, so ordinary commits can't ship
# an update to users by accident.
on:
  push:
    tags:
      - 'v*'
  # Lets you dry-run the whole matrix from the Actions tab without tagging.
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    strategy:
      # One platform failing shouldn't discard the others' artifacts -- a
      # partial release is still useful and can be topped up by re-running.
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            # Universal binary: one download covering Apple Silicon and Intel,
            # rather than making people identify their own Mac.
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tagging without bumping tauri.conf.json produces a release whose
      # artifacts and latest.json carry the OLD version, so installed apps see
      # their own version and offer no update -- an inert release that looks
      # completely successful. Fail here instead, where it's obvious.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but src-tauri/tauri.conf.json says $CONF_VERSION."
            echo "::error::Bump the version, commit, and move the tag to that commit."
            exit 1
          fi
          echo "Version $CONF_VERSION matches tag $GITHUB_REF_NAME"

      # Tauri can't cross-compile, which is the whole reason this workflow
      # exists: each artifact must be built on its own OS.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Apple architectures, since the mac job builds a universal binary.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this the build still succeeds but produces no signatures,
          # and every installed app rejects the update as unsigned. The key
          # must be the same one whose public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Hardcoded empty rather than read from a secret: the key was
          # generated without a password, and GitHub refuses to store a secret
          # with an empty value. The variable still has to be present -- if it
          # is unset entirely the signer waits for a password on stdin, which
          # in CI means the job hangs until it times out.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'See the assets below to download and install.'
          # Published as a draft so you can read the notes and confirm every
          # platform actually uploaded before users' apps start offering it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Generates latest.json covering every platform in the matrix. This
          # is why the workflow beats the local scripts for multi-platform:
          # a hand-built manifest would only ever describe the OS you built on.
          includeUpdaterJson: true
